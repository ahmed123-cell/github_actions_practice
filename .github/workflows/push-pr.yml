on:
  push:
    branches:
      - master
      - "release/**"
    
    paths:
      - "src/**"
  
  pull_request:
    branches:
      - master
      - "release/**"

jobs:
  test:
    runs_on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6.1.0

    - name: Run Tests
      uses: npm test
